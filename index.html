
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频拉片分析助手 - 专业短视频深度拆解</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Markdown Styles */
        .markdown-content {
            font-size: 0.95rem;
            line-height: 1.75;
        }
        .markdown-content h1 { @apply text-3xl font-bold mb-6 mt-10 text-slate-900 tracking-tight; }
        .markdown-content h2 { @apply text-xl font-bold mb-4 mt-8 text-slate-800 flex items-center; }
        .markdown-content h3 { @apply text-lg font-semibold mb-3 mt-6 text-slate-700; }
        .markdown-content p { @apply mb-4 text-slate-600 leading-7; }
        .markdown-content ul { @apply list-disc list-outside ml-5 mb-6 space-y-1 text-slate-600; }
        .markdown-content ol { @apply list-decimal list-outside ml-5 mb-6 space-y-1 text-slate-600; }
        .markdown-content li { @apply pl-1; }
        .markdown-content strong { @apply font-semibold text-slate-900; }
        .markdown-content blockquote { @apply border-l-4 border-indigo-200 pl-4 py-1 my-4 italic text-slate-500 bg-slate-50/50 rounded-r-lg; }
        
        /* Table Styles within Markdown (non-ShotTable) */
        .markdown-content table:not(.shot-table) { @apply w-full border-collapse mb-8 text-sm bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden; }
        .markdown-content th { @apply bg-slate-50 border-b border-slate-200 px-4 py-3 text-left font-semibold text-slate-700 whitespace-nowrap; }
        .markdown-content td { @apply border-b border-slate-100 px-4 py-3 text-slate-600; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
